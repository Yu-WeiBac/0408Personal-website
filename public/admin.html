<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYS.ADMIN — 04080606</title>
<style>
:root { --bg: #0A0A0A; --panel: #141414; --border: #222; --text: #E5E5E5; --muted: #888; --jade: #00D1FF; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, "PingFang SC", sans-serif; display: flex; min-height: 100vh; }
aside { width: 250px; background: var(--panel); border-right: 1px solid var(--border); padding: 3rem 2rem; position: fixed; height: 100vh; display: flex; flex-direction: column; }
.logo { font-size: 1.1rem; font-weight: 600; margin-bottom: 3rem; color: #fff; letter-spacing: 1px; }
nav button { display: block; width: 100%; background: none; border: none; color: var(--muted); text-align: left; padding: 0.9rem 1rem; margin-bottom: 0.5rem; border-radius: 8px; cursor: pointer; transition: 0.2s; font-size: 0.9rem; }
nav button.active { background: rgba(0,209,255,0.1); color: var(--jade); }
.item { display: flex; justify-content: space-between; align-items: center; background: #000; padding: 1.2rem; margin-bottom: 0.5rem; border-radius: 8px; border: 1px solid var(--border); }
main { margin-left: 250px; flex: 1; padding: 4rem; max-width: 1000px; }
.section { display: none; } .section.active { display: block; }
.card { background: var(--panel); padding: 2.5rem; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 2rem; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
label { display: block; margin-bottom: 0.5rem; font-size: 0.8rem; color: var(--muted); text-transform: uppercase; }
input, textarea, select { width: 100%; background: #000; border: 1px solid var(--border); color: #fff; padding: 0.9rem; border-radius: 8px; outline: none; font-family: inherit; font-size: 0.9rem; transition: 0.3s; }
input:focus, select:focus { border-color: var(--jade); }
button.primary { background: #fff; color: #000; border: none; padding: 1rem 2.5rem; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.3s; }
button.primary:hover { background: var(--jade); }
.btn-danger { color: #ff453a; background: none; border: 1px solid #ff453a; padding: 0.5rem 1.2rem; border-radius: 6px; cursor: pointer; }
.upload-zone { border: 1px dashed var(--border); border-radius: 8px; padding: 2.5rem; text-align: center; cursor: pointer; background: #000; margin-bottom: 1.5rem; transition: 0.3s; }
.upload-zone:hover { border-color: var(--jade); }
.upload-bar { height: 3px; background: var(--jade); width: 0%; transition: 0.2s; margin-top: 1rem; }
.status-text { font-size: 0.8rem; color: var(--muted); margin-top: 0.5rem; }
#login { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 1000; }
</style>
</head>
<body>

<div id="login"><div class="card" style="width: 350px;"><input type="password" id="admin-pwd" placeholder="授权密钥" style="margin-bottom:1.5rem; text-align:center"><button class="primary" onclick="login()" style="width:100%">VERIFY</button></div></div>

<aside>
    <div class="logo">SYS.ADMIN</div>
    <nav>
        <button onclick="showTab('works')" id="btn-works" class="active">成片管理 (Works)</button>
        <button onclick="showTab('clients')" id="btn-clients">品牌库 (Clients)</button>
        <button onclick="showTab('settings')" id="btn-settings">全局设置 (Settings)</button>
        <button onclick="logout()" style="color:#ff453a; margin-top:3rem">退出登录</button>
    </nav>
</aside>

<main>
    <div id="tab-works" class="section active">
        <h1>成片展示库</h1>
        <div id="works-list"></div>
        <div class="card" style="margin-top:3rem;">
            <h3 style="margin-bottom:2rem; color:var(--jade)">+ 部署新作品</h3>
            <div class="grid-2">
                <div><label>成片名称</label><input id="w-title"></div>
                <div><label>分类</label><select id="w-category"><option value="Commercial">商业广告</option><option value="BrandFilm">品牌宣传</option><option value="Documentary">纪录访谈</option><option value="Personal">个人创作</option></select></div>
                <div><label>合作客户</label><input id="w-client"></div>
                <div><label>具体职责</label><input id="w-roles" placeholder="如: 执导 / 调色"></div>
                <div style="grid-column:span 2"><label>核心标签 (Tags - 英文逗号隔开)</label><input id="w-tags"></div>
                <div style="grid-column:span 2"><label>项目简述 (Description)</label><textarea id="w-desc" rows="3"></textarea></div>
            </div>
            <label>视频文件上传 (R2)</label>
            <div class="upload-zone" id="w-video-zone" onclick="document.getElementById('w-video-file').click()">
                <input type="file" id="w-video-file" accept="video/*" onchange="upload(this,'w-video-url','w-video-bar','w-video-status')">
                <p>点击或拖拽上传 MP4</p><div class="upload-bar" id="w-video-bar"></div><div class="status-text" id="w-video-status">等待中</div>
            </div>
            <input type="hidden" id="w-video-url">
            <button class="primary" onclick="addWork()">保存成片</button>
        </div>
    </div>

    <div id="tab-clients" class="section">
        <h1>合作品牌管理</h1>
        <div id="clients-list" style="margin-bottom:2.5rem;"></div>
        <div class="card">
            <label>新增品牌 (文字名称 或 上传Logo图片)</label>
            <div class="grid-2"><input id="c-name" placeholder="品牌文字名称"><div class="upload-zone" style="margin:0; padding:1rem;" onclick="document.getElementById('c-logo-file').click()"><input type="file" id="c-logo-file" accept="image/*" onchange="upload(this,'c-logo-url',null,'c-logo-status')"><span id="c-logo-status">上传Logo图片</span></div><input type="hidden" id="c-logo-url"></div>
            <button class="primary" onclick="addClient()" style="margin-top:1.5rem">+ 加入跑马灯</button>
        </div>
    </div>

    <div id="tab-settings" class="section">
        <h1>全局系统设置</h1>
        <div class="card">
            <label>首页背景视频</label>
            <div class="upload-zone" onclick="document.getElementById('s-hero-file').click()" style="padding:1.5rem">
                <input type="file" id="s-hero-file" accept="video/*" onchange="upload(this,'s-hero-url','s-hero-bar','s-hero-status')">
                <div class="upload-bar" id="s-hero-bar"></div><div class="status-text" id="s-hero-status">等待上传</div>
            </div>
            <input type="hidden" id="s-hero-url">
            <label>个人简介文案</label><textarea id="s-about" rows="4"></textarea>
            <label>联系邮箱</label><input id="s-email">
            <h3 style="margin:3.5rem 0 1.5rem; border-top:1px solid #222; padding-top:2.5rem;">社交网络终端 (区分大小写)</h3>
            <div class="grid-2">
                <div><label>Vimeo (维密欧)</label><input id="s-vimeo"></div><div><label>YouTube (油管)</label><input id="s-yt"></div>
                <div><label>Instagram</label><input id="s-ins"></div><div><label>小红书</label><input id="s-xhs"></div>
                <div><label>Behance</label><input id="s-behance"></div><div><label>哔哩哔哩 (B站)</label><input id="s-bili"></div>
                <div><label>X (Twitter)</label><input id="s-x"></div><div><label>微博</label><input id="s-weibo"></div>
            </div>
            <button class="primary" id="save-all" onclick="saveSettings()" style="width:100%; margin-top:2.5rem;">💾 提交所有更新</button>
        </div>
    </div>
</main>

<script>
let token = sessionStorage.getItem('admin_token'), s_clients = [];
if(token) document.getElementById('login').style.display = 'none';

async function login() { const r = await fetch('/api/login',{method:'POST',body:JSON.stringify({password:document.getElementById('admin-pwd').value})}); if(r.ok){sessionStorage.setItem('admin_token',(await r.json()).token);location.reload()}else alert('Access Denied')}
function showTab(n){document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));document.getElementById('tab-'+n).classList.add('active');document.getElementById('btn-'+n).classList.add('active')}
async function api(p,m='GET',b=null){const r=await fetch('/api'+p,{method:m,headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:b?JSON.stringify(b):null});return r.json()}

async function loadData() {
    const works = await api('/admin/works');
    document.getElementById('works-list').innerHTML = works.map((w,i)=>`<div class="item"><div><strong style="color:var(--jade)">${w.title}</strong><span style="font-size:0.7rem;color:var(--muted);margin-left:1rem">${w.category}</span></div><button class="btn-danger" onclick="deleteWork(${i})">移除</button></div>`).join('');
    const s = await api('/admin/settings');
    document.getElementById('s-hero-url').value = s.heroVideo || '';
    document.getElementById('s-about').value = s.aboutBody || ''; document.getElementById('s-email').value = s.contactEmail || '';
    ['ins','xhs','behance','vimeo','yt','bili','x','weibo'].forEach(k=>{document.getElementById(`s-${k}`).value=s[`${k}Link`]||''});
    s_clients = s.clients || []; renderClients();
}

function renderClients(){document.getElementById('clients-list').innerHTML=s_clients.map((c,i)=>`<div class="item"><span>${c.name||'Logo图像'}</span><button class="btn-danger" onclick="s_clients.splice(${i},1);renderClients()">移除</button></div>`).join('')}
function addClient(){s_clients.push({name:document.getElementById('c-name').value,logoUrl:document.getElementById('c-logo-url').value});renderClients()}

async function upload(el,targetId,barId,statusId) {
    const f=el.files[0]; document.getElementById(statusId).innerText='正在上传...';
    const r=await fetch('/api/admin/upload/'+Date.now()+'_'+f.name,{method:'PUT',headers:{'Authorization':'Bearer '+token,'Content-Type':f.type},body:f});
    const d=await r.json(); document.getElementById(targetId).value=d.url; document.getElementById(statusId).innerText='✅ 上传成功';
}

async function addWork(){
    const works=await api('/admin/works');
    works.push({title:document.getElementById('w-title').value,videoUrl:document.getElementById('w-video-url').value,category:document.getElementById('w-category').value,client:document.getElementById('w-client').value,roles:document.getElementById('w-roles').value,tags:document.getElementById('w-tags').value,desc:document.getElementById('w-desc').value});
    await api('/admin/works','PUT',works);location.reload();
}
async function deleteWork(i){const works=await api('/admin/works');works.splice(i,1);await api('/admin/works','PUT',works);location.reload()}

async function saveSettings(){
    const b=document.getElementById('save-all');b.innerText='Syncing...';
    const s={heroVideo:document.getElementById('s-hero-url').value,aboutBody:document.getElementById('s-about').value,contactEmail:document.getElementById('s-email').value,insLink:document.getElementById('s-ins').value,xhsLink:document.getElementById('s-xhs').value,behanceLink:document.getElementById('s-behance').value,vimeoLink:document.getElementById('s-vimeo').value,ytLink:document.getElementById('s-yt').value,biliLink:document.getElementById('s-bili').value,xLink:document.getElementById('s-x').value,weiboLink:document.getElementById('s-weibo').value,clients:s_clients};
    await api('/api/admin/settings','PUT',s);b.innerText='✅ SUCCESS';setTimeout(()=>b.innerText='💾 提交所有更新',2000);
}
if(token)loadData();
</script>
</body>
</html>
