<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>于未氵 — Visual Artist & Director</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&family=Noto+Sans+SC:wght@200;300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
<style>
:root {
    --bg-base: #000000;
    --glass: rgba(255, 255, 255, 0.03);
    --glass-border: rgba(255, 255, 255, 0.08);
    --glass-blur: blur(30px);
    --cyan: #00D1FF;
    --cyan-glow: rgba(0, 209, 255, 0.2);
    --text: #FFFFFF;
    --text-dim: rgba(255, 255, 255, 0.5);
    --font-main: 'Inter', 'Noto Sans SC', sans-serif;
    --gutter: clamp(1.5rem, 4vw, 4rem);
    /* 鼠标位置变量 */
    --mx: 50%; --my: 50%;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; background: var(--bg-base); }
body { background: var(--bg-base); color: var(--text); font-family: var(--font-main); -webkit-font-smoothing: antialiased; overflow-x: hidden; cursor: none; }

/* === 动态液态底光 (响应鼠标) === */
.ambient { position: fixed; inset: 0; z-index: -2; pointer-events: none; background: #000; overflow: hidden; }
.orb {
    position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.3;
    transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1); /* 平滑跟随 */
}
/* orb-1 追随鼠标 */
.orb-1 {
    width: 60vw; height: 60vw; background: #0044FF;
    left: calc(var(--mx) - 30vw); top: calc(var(--my) - 30vw);
}
/* orb-2 反向运动 */
.orb-2 {
    width: 50vw; height: 50vw; background: var(--cyan);
    right: calc(var(--mx) - 25vw); bottom: calc(var(--my) - 25vw);
}

/* === 极致跟手光标 === */
.cursor-dot { position: fixed; top: 0; left: 0; width: 6px; height: 6px; background: #fff; border-radius: 50%; z-index: 10000; pointer-events: none; mix-blend-mode: difference; }
.cursor-ring {
    position: fixed; top: 0; left: 0; width: 34px; height: 32px;
    border: 1px solid rgba(255,255,255,0.25); border-radius: 50%;
    z-index: 9999; pointer-events: none;
    transition: width 0.3s, height 0.3s, border-color 0.3s, background 0.3s;
}
.cursor-ring.is-hover { width: 60px; height: 60px; border-color: var(--cyan); background: rgba(0,209,255,0.05); backdrop-filter: blur(4px); }

/* === 全局毛玻璃胶囊导航 === */
nav {
    position: fixed; top: 1.5rem; left: 50%; transform: translateX(-50%); z-index: 100;
    background: rgba(10, 10, 12, 0.4); backdrop-filter: var(--glass-blur); border: 1px solid var(--glass-border); border-radius: 999px;
    padding: 0.6rem 2rem; display: flex; align-items: center; gap: 3.5rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
}
.logo { font-size: 1.1rem; font-weight: 500; color: #fff; text-decoration: none; letter-spacing: 2px; }
.logo span { color: var(--cyan); }
.menu { display: flex; gap: 2.5rem; list-style: none; }
.menu a { color: var(--text-dim); text-decoration: none; font-size: 0.8rem; text-transform: uppercase; transition: 0.3s; }
.menu a:hover { color: #fff; }
.lang-switch { font-size: 0.8rem; cursor: pointer; color: var(--text-dim); transition: 0.3s; }

/* === Hero === */
.hero { position: relative; height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; }
.hero-video-container { position: absolute; inset: 0; z-index: -1; opacity: 0.5; overflow: hidden; }
.hero-video { width: 100%; height: 100%; object-fit: cover; }
.hero-overlay { position: absolute; inset: 0; background: radial-gradient(circle at center, transparent 0%, #000 100%); z-index: 0; }
.hero-title { position: relative; z-index: 1; font-size: clamp(2.5rem, 6vw, 5rem); font-weight: 200; line-height: 1.2; letter-spacing: 3px; }
.hero-title em { background: linear-gradient(135deg, #fff 0%, var(--cyan) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-style: normal; font-weight: 400; }

/* === 玻璃作品网格 === */
.works { padding: 6rem var(--gutter); position: relative; z-index: 2; }
.works-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 1.5rem; }
.glass-card {
    background: var(--glass); backdrop-filter: var(--glass-blur); border: 1px solid var(--glass-border);
    border-radius: 24px; padding: 1.2rem; grid-column: span 6; aspect-ratio: 16/10;
    text-decoration: none; color: #fff; transition: all 0.5s cubic-bezier(0.2, 1, 0.3, 1);
}
.glass-card:hover { transform: translateY(-8px); border-color: rgba(0,209,255,0.3); box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
.work-card:nth-child(4n+1), .work-card:nth-child(4n+4) { grid-column: span 8; }
.work-card:nth-child(4n+2), .work-card:nth-child(4n+3) { grid-column: span 4; aspect-ratio: 4/5; }

.media-wrap { border-radius: 16px; overflow: hidden; height: 100%; width: 100%; position: relative; background: #0a0a0a; }
.work-media { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; transition: 0.6s; }
.glass-card:hover .work-media { opacity: 1; transform: scale(1.05); }

/* === 社交链接 (完全透明毛玻璃) === */
.contact { padding: 10rem var(--gutter); text-align: center; position: relative; z-index: 2; }
.contact-glass {
    background: var(--glass); backdrop-filter: var(--glass-blur); border: 1px solid var(--glass-border);
    border-radius: 40px; max-width: 850px; margin: 0 auto; padding: 6rem 2rem;
    box-shadow: 0 40px 100px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
}
.email-link { font-size: clamp(1.8rem, 4vw, 3rem); font-weight: 200; color: #fff; text-decoration: none; transition: 0.3s; margin-bottom: 3.5rem; display: inline-block; }
.email-link:hover { color: var(--cyan); text-shadow: 0 0 20px var(--cyan-glow); }

.social-bar { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
.social-bar a {
    background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border);
    padding: 0.8rem 1.8rem; border-radius: 999px; color: #fff; text-decoration: none;
    font-size: 0.8rem; letter-spacing: 1px; text-transform: uppercase; transition: 0.3s;
}
.social-bar a:hover { background: var(--cyan); color: #000; border-color: var(--cyan); box-shadow: 0 0 20px var(--cyan-glow); transform: translateY(-2px); }

footer { padding: 4rem; text-align: center; font-size: 0.7rem; color: var(--text-dim); letter-spacing: 2px; }

@media (max-width: 900px) {
    nav { width: 92%; padding: 0.6rem 1.2rem; gap: 1rem; } .menu { display: none; }
    .glass-card:nth-child(n) { grid-column: span 12; aspect-ratio: 16/9; }
}
</style>
</head>
<body>

<div class="ambient"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>
<div class="cursor-dot"></div><div class="cursor-ring"></div>

<nav>
    <a href="#" class="logo hover-target">于未<span>氵</span></a>
    <div class="nav-right">
        <ul class="menu">
            <li><a href="#works" data-i18n="navW">Work</a></li>
            <li><a href="#about" data-i18n="navA">About</a></li>
            <li><a href="#contact" data-i18n="navC">Contact</a></li>
        </ul>
        <div class="lang-switch hover-target" onclick="toggleLang()" id="lang-btn">EN</div>
    </div>
</nav>

<section class="hero">
    <div class="hero-video-container" id="hero-media-container"></div>
    <div class="hero-overlay"></div>
    <h1 class="hero-title">控制光影，<br><em>重塑液态的边界。</em></h1>
</section>

<section class="works" id="works">
    <div class="works-grid" id="works-grid"></div>
</section>

<section class="contact">
    <div class="contact-glass">
        <a href="" class="email-link hover-target" id="contact-email-link">...</a>
        <div class="social-bar" id="social-links"></div>
    </div>
</section>

<footer>© 2026 于未氵 · LIQUID GLASS VISION</footer>

<script>
// 1. 0 延迟交互引擎
const dot = document.querySelector('.cursor-dot'), ring = document.querySelector('.cursor-ring');
const root = document.documentElement;

document.addEventListener('mousemove', e => {
    const x = e.clientX, y = e.clientY;
    // 瞬时更新光标
    dot.style.transform = `translate(${x}px, ${y}px)`;
    // 极低延迟平滑跟随
    gsap.to(ring, { x: x, y: y, duration: 0.15, ease: "power2.out" });
    // 更新背景光位置变量
    root.style.setProperty('--mx', (x / window.innerWidth * 100) + '%');
    root.style.setProperty('--my', (y / window.innerHeight * 100) + '%');
});

document.addEventListener('mouseover', e => { if (e.target.closest('.hover-target, .glass-card, a, button')) ring.classList.add('is-hover'); });
document.addEventListener('mouseout', e => { if (e.target.closest('.hover-target, .glass-card, a, button')) ring.classList.remove('is-hover'); });

// 2. 数据渲染
async function loadData() {
    try {
        const [wRes, sRes] = await Promise.all([fetch('/api/works'), fetch('/api/settings')]);
        const works = await wRes.json(), s = await sRes.json();
        
        document.getElementById('works-grid').innerHTML = works.map(w => `
            <a href="${w.link || '#'}" class="glass-card work-card hover-target" target="_blank">
                <div class="media-wrap">
                    <video class="work-media" muted loop playsinline ${w.posterUrl ? `poster="${w.posterUrl}"` : ''} src="${w.videoUrl}"></video>
                </div>
                <div style="margin-top:1.2rem">
                    <div class="work-tag">${w.client || w.category || 'PROJECT'}</div>
                    <div class="work-name">${w.title}</div>
                </div>
            </a>
        `).join('');

        // 视频悬停播放
        document.querySelectorAll('.glass-card').forEach(c => {
            const v = c.querySelector('video');
            c.onmouseenter = () => v.play(); c.onmouseleave = () => { v.pause(); v.currentTime = 0; };
        });

        if(s.heroVideo) document.getElementById('hero-media-container').innerHTML = `<video class="hero-video" autoplay muted loop playsinline src="${s.heroVideo}"></video>`;
        const mail = document.getElementById('contact-email-link'); mail.href = `mailto:${s.contactEmail}`; mail.innerText = s.contactEmail;
        
        // 社交链接全量渲染
        const socialData = [
            {label: 'Vimeo', url: s.vimeoLink}, {label: 'YouTube', url: s.ytLink}, {label: 'Instagram', url: s.insLink},
            {label: '小红书', url: s.xhsLink}, {label: 'Behance', url: s.behanceLink}, {label: '哔哩哔哩', url: s.biliLink},
            {label: 'X (Twitter)', url: s.xLink}, {label: '微博', url: s.weiboLink}
        ];
        document.getElementById('social-links').innerHTML = socialData.filter(d => d.url).map(d => `<a href="${d.url}" target="_blank" class="hover-target">${d.label}</a>`).join('');

        // 揭示动画
        gsap.from('.glass-card', { y: 50, opacity: 0, stagger: 0.1, scrollTrigger: { trigger: '.works-grid', start: 'top 80%' } });
    } catch (e) { console.error(e); }
}
loadData();
</script>
</body>
</html>
