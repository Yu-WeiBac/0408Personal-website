<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>于未氵 — Visual Artist & Director</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,200;1,9..144,400&family=Noto+Serif+SC:wght@300;500;700&family=Inter:wght@200;400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
<style>
:root {
    --bg: #000; --jade: #00D1FF;
    --glass: rgba(255, 255, 255, 0.03);
    --glass-border: rgba(255, 255, 255, 0.08);
    --font-serif: 'Noto Serif SC', serif;
    --font-sans: 'Inter', -apple-system, "PingFang SC", sans-serif;
    --gutter: clamp(1.5rem, 6vw, 5rem);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; background: #000; }
body { background: #000; color: #fff; font-family: var(--font-sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; cursor: none; }

/* === 1. 物理底光与噪点 === */
body::before { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 50; opacity: 0.04; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); mix-blend-mode: overlay; }
.ambient { position: fixed; inset: 0; z-index: -2; pointer-events: none; background: #000; overflow: hidden; }
.orb { position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.25; will-change: transform; transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1); }
.orb-1 { width: 65vw; height: 65vw; background: #0044FF; top: -15%; left: -15%; }
.orb-2 { width: 55vw; height: 55vw; background: var(--jade); bottom: -10%; right: -10%; }

/* === 2. 绝对重心光标 === */
.cursor-container { position: fixed; top: 0; left: 0; z-index: 10000; pointer-events: none; will-change: transform; }
.cursor-dot { position: absolute; width: 4px; height: 4px; background: #fff; border-radius: 50%; transform: translate(-50%, -50%); }
.cursor-ring {
    position: absolute; width: 34px; height: 34px; border: 1px solid rgba(255,255,255,0.3); border-radius: 50%;
    transform: translate(-50%, -50%); mix-blend-mode: difference; backdrop-filter: blur(2px);
    transition: width 0.3s, height 0.3s, border-color 0.3s; transform-origin: center center;
}
.cursor-container.is-hover .cursor-ring { width: 75px; height: 70px; border-color: var(--jade); background: rgba(0,209,255,0.05); }

/* === 3. 分散式固定导航 === */
header { position: fixed; top: 0; left: 0; right: 0; z-index: 100; height: 100px; display: flex; align-items: center; padding: 0 var(--gutter); pointer-events: none; }
header > * { pointer-events: auto; }
.nav-logo { font-size: 1.2rem; font-weight: 600; color: #fff; text-decoration: none; flex: 1; text-align: left; }
.nav-logo span { color: var(--jade); font-family: var(--font-serif); font-style: italic; }
.nav-menu { display: flex; gap: 3rem; list-style: none; flex: 2; justify-content: center; background: rgba(10,10,12,0.4); backdrop-filter: blur(30px); border: 1px solid var(--glass-border); border-radius: 99px; padding: 0.7rem 2.5rem; box-shadow: 0 15px 30px rgba(0,0,0,0.4); }
.nav-menu a { color: rgba(255,255,255,0.5); text-decoration: none; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; }
.nav-menu a:hover { color: #fff; }
.nav-lang { flex: 1; text-align: right; }
.lang-btn { font-size: 0.75rem; cursor: pointer; color: rgba(255,255,255,0.4); transition: 0.3s; padding: 0.5rem 1rem; }
.lang-btn:hover { color: #fff; }

/* === 4. 主体布局 === */
section { position: relative; z-index: 2; }
.hero { height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; }
.hero-title { font-family: var(--font-serif); font-size: clamp(2rem, 5.5vw, 5rem); font-weight: 300; line-height: 1.4; letter-spacing: 2px; }
.hero-title em { color: var(--jade); font-style: italic; }

.works { padding: 6rem var(--gutter); }
.works-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 4rem; border-bottom: 1px solid var(--glass-border); padding-bottom: 1rem; }
.filter-bar { display: flex; gap: 2rem; }
.filter-btn { background: none; border: none; color: rgba(255,255,255,0.4); font-size: 0.7rem; text-transform: uppercase; cursor: pointer; transition: 0.3s; }
.filter-btn.active { color: #fff; border-bottom: 1px solid #fff; }

.works-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 1.5rem; }
.glass-card { background: var(--glass); backdrop-filter: blur(25px); border: 1px solid var(--glass-border); border-radius: 24px; padding: 1.2rem; grid-column: span 6; aspect-ratio: 16/10; text-decoration: none; color: #fff; transition: 0.6s cubic-bezier(0.16, 1, 0.3, 1); cursor: pointer; }
.glass-card:hover { transform: translateY(-10px); border-color: rgba(0,209,255,0.25); }
.work-media { border-radius: 16px; overflow: hidden; width: 100%; height: 100%; background: #080808; position: relative; }
.work-media video { width: 100%; height: 100%; object-fit: cover; opacity: 0.7; transition: 0.6s; }

/* 详情层 */
.cinema { position: fixed; inset: 0; background: #000; z-index: 10000; display: flex; opacity: 0; pointer-events: none; transition: 0.5s; }
.cinema.active { opacity: 1; pointer-events: auto; }
.cinema-close { position: absolute; top: 2rem; right: 3rem; color: #fff; font-size: 2.5rem; cursor: pointer; background: none; border: none; font-weight: 100; }
.cinema-player { flex: 7; display: flex; align-items: center; justify-content: center; padding: 2rem; }
.cinema-player video { width: 100%; max-height: 85vh; border-radius: 8px; box-shadow: 0 30px 80px rgba(0,0,0,0.9); }
.cinema-aside { flex: 3; padding: 6rem 4rem; overflow-y: auto; }

/* 联系与品牌 */
.clients { padding: 4rem 0; overflow: hidden; border-top: 1px solid #111; }
.marquee { display: flex; width: max-content; animation: scroll 50s linear infinite; align-items: center; }
.client-item { margin-right: 6rem; opacity: 0.3; }
.client-item img { max-height: 22px; width: auto; filter: brightness(2); }
@keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }

.contact { padding: 8rem var(--gutter); }
.contact-glass { background: var(--glass); backdrop-filter: blur(50px); border: 1px solid var(--glass-border); border-radius: 40px; max-width: 850px; margin: 0 auto; padding: 6rem 2rem; text-align: center; }
.email-link { font-family: var(--font-serif); font-size: clamp(1.5rem, 3.5vw, 2.8rem); font-weight: 300; color: #fff; text-decoration: none; transition: 0.4s; }
.social-bar { display: flex; gap: 1rem; justify-content: center; margin-top: 4rem; flex-wrap: wrap; }
.social-bar a { background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); padding: 0.7rem 1.6rem; border-radius: 999px; color: #fff; text-decoration: none; font-size: 0.75rem; text-transform: uppercase; transition: 0.3s; }
.social-bar a:hover { background: var(--jade); color: #000; box-shadow: 0 0 25px rgba(0, 209, 255, 0.4); }

footer { padding: 3rem var(--gutter); text-align: center; font-size: 0.7rem; color: rgba(255,255,255,0.3); letter-spacing: 2px; }

@media (max-width: 1000px) { header { height: 80px; } .nav-menu { display: none; } .glass-card { grid-column: span 12; } .cinema { flex-direction: column; } }
</style>
</head>
<body>

<div class="ambient"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>
<div class="cursor-container"><div class="cursor-ring"></div><div class="cursor-dot"></div></div>

<header>
    <a href="/" class="nav-logo hover-target">于未<span>氵</span></a>
    <ul class="nav-menu">
        <li><a href="#works" class="hover-target" data-i18n="navW">Work</a></li>
        <li><a href="#about" class="hover-target" data-i18n="navA">About</a></li>
        <li><a href="#contact" class="hover-target" data-i18n="navC">Contact</a></li>
    </ul>
    <div class="nav-lang"><span class="lang-btn hover-target" onclick="toggleLang()" id="lang-btn">EN</span></div>
</header>

<section class="hero">
    <div id="hero-media-container" style="position: absolute; inset: 0; z-index: -1;"></div>
    <div class="hero-title scroll-reveal">控制光影，<br><em>重塑液态的边界。</em></div>
</section>

<section id="about" class="about"><div id="about-text" style="padding: 10rem var(--gutter); text-align: center; font-size: clamp(1.1rem, 2vw, 1.5rem); font-family: var(--font-serif); font-weight: 300; color: #bbb; line-height: 2;"></div></section>

<section id="works" class="works">
    <div class="works-header scroll-reveal">
        <div style="font-size:0.7rem; letter-spacing:3px" data-i18n="secW">SELECTED WORKS</div>
        <div class="filter-bar">
            <button class="filter-btn active hover-target" data-filter="All">All</button>
            <button class="filter-btn hover-target" data-filter="Commercial">Commercial</button>
            <button class="filter-btn hover-target" data-filter="Personal">Personal</button>
        </div>
    </div>
    <div class="works-grid" id="works-grid"></div>
</section>

<div class="cinema" id="cinema">
    <button class="cinema-close hover-target" onclick="closeCinema()">×</button>
    <div class="cinema-player" id="cinema-box"></div>
    <div class="cinema-aside">
        <h2 id="ca-title" style="font-size:2rem; font-weight:300; margin-bottom:1rem">Title</h2>
        <div style="font-size:0.8rem; color:rgba(255,255,255,0.4); margin-bottom:2rem">Client: <span id="ca-client" style="color:#fff"></span></div>
        <p id="ca-desc" style="font-size:0.95rem; color:#aaa; line-height:1.8; margin-bottom:3rem; border-left:1px solid var(--jade); padding-left:1.5rem"></p>
        <div style="margin-bottom:1.5rem"><div data-i18n="mR" style="font-size:0.7rem; color:rgba(255,255,255,0.4); text-transform:uppercase; margin-bottom:0.5rem">Roles</div><div id="ca-roles" style="color:var(--jade)"></div></div>
    </div>
</div>

<div class="clients"><div class="marquee" id="clients-marquee"></div></div>

<section id="contact" class="contact">
    <div class="contact-glass scroll-reveal">
        <a href="" class="email-link hover-target" id="contact-email-link"></a>
        <div class="social-bar" id="social-links"></div>
    </div>
</section>

<footer>© 2026 于未氵</footer>

<script>
const container = document.querySelector('.cursor-container'), ring = document.querySelector('.cursor-ring');
const orb1 = document.querySelector('.orb-1'), orb2 = document.querySelector('.orb-2');
let mouse = { x: window.innerWidth/2, y: window.innerHeight/2 }, pos = { x: mouse.x, y: mouse.y }, lastPos = { x: mouse.x, y: mouse.y };

document.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });

function updatePhysics() {
    pos.x += (mouse.x - pos.x) * 0.15; pos.y += (mouse.y - pos.y) * 0.15;
    container.style.transform = `translate3d(${pos.x}px, ${pos.y}px, 0)`;
    const dx = pos.x - lastPos.x, dy = pos.y - lastPos.y;
    const vel = Math.sqrt(dx*dx + dy*dy);
    const angle = Math.atan2(dy, dx) * 180 / Math.PI;
    const stretch = Math.min(vel * 0.02, 0.4); 
    ring.style.transform = `translate(-50%, -50%) rotate(${angle}deg) scale(${1 + stretch}, ${1 - stretch})`;
    orb1.style.transform = `translate(${(mouse.x - window.innerWidth/2) * 0.12}px, ${(mouse.y - window.innerHeight/2) * 0.12}px)`;
    orb2.style.transform = `translate(${(mouse.x - window.innerWidth/2) * -0.08}px, ${(mouse.y - window.innerHeight/2) * -0.08}px)`;
    lastPos.x = pos.x; lastPos.y = pos.y;
    requestAnimationFrame(updatePhysics);
}
requestAnimationFrame(updatePhysics);

document.addEventListener('mouseover', e => { if (e.target.closest('.hover-target, .glass-card, a, button')) container.classList.add('is-hover'); });
document.addEventListener('mouseout', e => { if (e.target.closest('.hover-target, .glass-card, a, button')) container.classList.remove('is-hover'); });

let allWorks = [], currentLang = localStorage.getItem('site_lang') || 'zh';
const dict = { zh: { navW: '作品', navA: '关于', navC: '联系', secW: '精选成片', mR: '具体职责' }, en: { navW: 'WORK', navA: 'ABOUT', navC: 'CONTACT', secW: 'SELECTED WORKS', mR: 'ROLES' } };
function toggleLang() { currentLang = currentLang === 'zh' ? 'en' : 'zh'; localStorage.setItem('site_lang', currentLang); location.reload(); }
function applyLang() { 
    document.getElementById('lang-btn').innerText = currentLang === 'zh' ? 'EN' : '中';
    document.querySelectorAll('[data-i18n]').forEach(el => { el.innerText = dict[currentLang][el.getAttribute('data-i18n')]; });
}

window.openCinema = (idx) => {
    const w = allWorks[idx];
    document.getElementById('ca-title').innerText = w.title;
    document.getElementById('ca-client').innerText = w.client || '-';
    document.getElementById('ca-desc').innerHTML = (w.desc || '').replace(/\n/g, '<br>');
    document.getElementById('ca-roles').innerText = w.roles || '-';
    document.getElementById('cinema-box').innerHTML = `<video src="${w.videoUrl}" controls autoplay playsinline></video>`;
    document.getElementById('cinema').classList.add('active');
};
function closeCinema() { document.getElementById('cinema').classList.remove('active'); setTimeout(()=>document.getElementById('cinema-box').innerHTML='', 500); }

async function loadData() {
    try {
        applyLang();
        const [wRes, sRes] = await Promise.all([fetch('/api/works'), fetch('/api/settings')]);
        allWorks = await wRes.json(); const s = await sRes.json();
        document.getElementById('works-grid').innerHTML = allWorks.map((w, idx) => `
            <div class="glass-card hover-target" onclick="openCinema(${idx})">
                <div class="work-media"><video src="${w.videoUrl}" muted loop playsinline></video></div>
                <div style="margin-top:1.2rem; display:flex; justify-content:space-between; align-items:baseline;">
                    <div style="font-size:1.1rem; font-family:var(--font-serif); font-weight:500;">${w.title}</div>
                    <div style="font-size:0.6rem; color:var(--jade); letter-spacing:1px; text-transform:uppercase;">${w.category || 'FILM'}</div>
                </div>
            </div>`).join('');
        document.querySelectorAll('.glass-card video').forEach(v => { v.parentElement.onmouseenter=()=>v.play(); v.parentElement.onmouseleave=()=>{v.pause(); v.currentTime=0;}; });
        if(s.heroVideo) document.getElementById('hero-media-container').innerHTML = `<video style="width:100%; height:100%; object-fit:cover; opacity:0.5;" autoplay muted loop playsinline src="${s.heroVideo}"></video>`;
        if(s.aboutBody) document.getElementById('about-text').innerHTML = s.aboutBody.replace(/\n/g, '<br>');
        document.getElementById('contact-email-link').innerText = s.contactEmail || 'hi@04080606.xyz';
        document.getElementById('contact-email-link').href = `mailto:${s.contactEmail}`;
        const socials = [
            {label: 'Instagram', url: s.insLink}, {label: '小红书', url: s.xhsLink}, {label: 'Behance', url: s.behanceLink},
            {label: 'Vimeo', url: s.vimeoLink}, {label: 'YouTube', url: s.ytLink}, {label: '哔哩哔哩', url: s.biliLink},
            {label: 'X (Twitter)', url: s.xLink}, {label: '微博', url: s.weiboLink}
        ];
        document.getElementById('social-links').innerHTML = socials.filter(d => d.url).map(d => `<a href="${d.url}" target="_blank" class="hover-target">${d.label}</a>`).join('');
        if(s.clients && s.clients.length > 0) {
            const html = s.clients.map(c => `<div class="client-item">${c.logoUrl ? `<img src="${c.logoUrl}">` : `<span>${c.name}</span>`}</div>`).join('');
            document.getElementById('clients-marquee').innerHTML = `<div class="marquee">${html}${html}</div>`;
        }
        gsap.from('.scroll-reveal', { y: 30, opacity: 0, stagger: 0.1, scrollTrigger: { trigger: '.scroll-reveal', start: 'top 90%' } });
    } catch (e) { console.error(e); }
}
loadData();
</script>
</body>
</html>
