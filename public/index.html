<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>于未氵 — Director / Visual Artist</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #050505; --ink: #111; --text: #F5F5F7; --muted: #86868B;
    --accent: #E5E5E5; --font: 'Inter', 'Noto Sans SC', sans-serif;
    --gutter: clamp(1.5rem, 4vw, 4rem);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; background: var(--bg); }
body { background: var(--bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; overflow-x: hidden; line-height: 1.6; }

/* 导航栏 */
nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 2rem var(--gutter); display: flex; justify-content: space-between; align-items: center; mix-blend-mode: difference; }
.logo { font-size: 1.2rem; font-weight: 500; color: #fff; text-decoration: none; letter-spacing: 0.1em; }
.logo span { font-style: italic; }
.menu { display: flex; gap: 3rem; list-style: none; }
.menu a { color: #fff; text-decoration: none; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.15em; transition: opacity 0.3s; opacity: 0.6; }
.menu a:hover { opacity: 1; }

/* 1. 首页首屏 (Hero) */
.hero { position: relative; height: 100vh; width: 100%; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.hero-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.8; }
.hero-overlay { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(5,5,5,1) 100%); }

/* 2. 个人简介 (About) */
.about { padding: 10rem var(--gutter); max-width: 1200px; margin: 0 auto; text-align: center; }
.about-text { font-size: clamp(1.2rem, 2.5vw, 2rem); font-weight: 300; line-height: 1.6; color: var(--text); }
.about-text em { font-style: normal; color: #fff; font-weight: 500; border-bottom: 1px solid rgba(255,255,255,0.3); }

/* 3. 成片展示 (Selected Works) - 瀑布流网格 */
.works { padding: 4rem var(--gutter); }
.section-title { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.2em; color: var(--muted); margin-bottom: 3rem; }
.works-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 1rem; }
.work-card { position: relative; background: var(--ink); overflow: hidden; cursor: pointer; display: block; aspect-ratio: 16/9; }
/* 不规则排版 */
.work-card:nth-child(4n+1) { grid-column: span 8; aspect-ratio: 16/9; }
.work-card:nth-child(4n+2) { grid-column: span 4; aspect-ratio: 4/5; }
.work-card:nth-child(4n+3) { grid-column: span 4; aspect-ratio: 4/5; }
.work-card:nth-child(4n+4) { grid-column: span 8; aspect-ratio: 16/9; }

.work-card video, .work-card img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(0.5) brightness(0.7); transition: all 0.5s ease; }
.work-card:hover video { filter: grayscale(0) brightness(1); transform: scale(1.02); }
.work-info { position: absolute; bottom: 0; left: 0; right: 0; padding: 2rem; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); opacity: 0; transition: opacity 0.4s ease; }
.work-card:hover .work-info { opacity: 1; }
.work-title { font-size: 1.5rem; font-weight: 400; margin-bottom: 0.3rem; }
.work-roles { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }

/* 影院模式 Modal */
.cinema-modal { position: fixed; inset: 0; background: #000; z-index: 1000; display: flex; flex-direction: column; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; }
.cinema-modal.active { opacity: 1; pointer-events: auto; }
.cinema-close { position: absolute; top: 2rem; right: 3rem; color: #fff; font-size: 2rem; cursor: pointer; z-index: 1001; background: none; border: none; }
.cinema-video-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 4rem 2rem 0; }
.cinema-video-container video { max-width: 100%; max-height: 80vh; outline: none; }
.cinema-meta { padding: 2rem 4rem; text-align: left; }
.cinema-meta h2 { font-size: 1.8rem; font-weight: 400; margin-bottom: 0.5rem; }
.cinema-meta p { font-size: 0.9rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }

/* 4. 客户/合作品牌 (Selected Clients) */
.clients { padding: 8rem 0; overflow: hidden; border-top: 1px solid rgba(255,255,255,0.05); border-bottom: 1px solid rgba(255,255,255,0.05); }
.clients-inner { padding-left: var(--gutter); margin-bottom: 2rem; }
.marquee { display: flex; width: max-content; animation: scroll 30s linear infinite; }
.marquee:hover { animation-play-state: paused; }
.marquee span { font-size: 2rem; font-weight: 600; color: var(--muted); text-transform: uppercase; margin-right: 6rem; letter-spacing: 0.05em; transition: color 0.3s; }
.marquee span:hover { color: #fff; }
@keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }

/* 5. 联系方式 (Contact) */
.contact { padding: 10rem var(--gutter); text-align: center; }
.contact-mail { font-size: clamp(2rem, 5vw, 4rem); font-weight: 300; color: var(--text); text-decoration: none; position: relative; display: inline-block; padding-bottom: 0.5rem; transition: color 0.3s; }
.contact-mail::after { content: ''; position: absolute; left: 0; bottom: 0; width: 100%; height: 2px; background: #fff; transform: scaleX(0); transform-origin: right; transition: transform 0.6s cubic-bezier(0.19, 1, 0.22, 1); }
.contact-mail:hover::after { transform: scaleX(1); transform-origin: left; }
.socials { display: flex; gap: 2rem; justify-content: center; margin-top: 4rem; }
.socials a { color: var(--muted); text-decoration: none; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em; transition: color 0.3s; }
.socials a:hover { color: #fff; }

@media (max-width: 800px) {
    .work-card:nth-child(n) { grid-column: span 12; aspect-ratio: 16/9; }
    .menu { display: none; }
    .cinema-meta { padding: 2rem; }
}
</style>
</head>
<body>

<nav>
    <a href="#" class="logo">于未<span>氵</span></a>
    <ul class="menu">
        <li><a href="#works">Work</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#contact">Contact</a></li>
    </ul>
</nav>

<section class="hero">
    <div id="hero-media-container" style="position: absolute; inset: 0;"></div>
    <div class="hero-overlay"></div>
</section>

<section class="about" id="about">
    <div class="about-text" id="about-text">
        探索影像的边界，专注于 <em>视觉执导</em>、<em>动态剪辑</em> 与 <em>DaVinci Resolve 极致调色</em>。<br>让每一帧光影都拥有其独属的情绪张力。
    </div>
</section>

<section class="works" id="works">
    <div class="section-title">Selected Works</div>
    <div class="works-grid" id="works-grid"></div>
</section>

<div class="cinema-modal" id="cinema-modal">
    <button class="cinema-close" onclick="closeCinema()">×</button>
    <div class="cinema-video-container" id="cinema-player-box"></div>
    <div class="cinema-meta">
        <h2 id="cinema-title">Title</h2>
        <p id="cinema-roles">Director / Editor</p>
    </div>
</div>

<section class="clients">
    <div class="clients-inner section-title">Selected Clients</div>
    <div class="marquee">
        <div>
            <span>Apple</span><span>OKX</span><span>Nike</span><span>Porsche</span><span>Tencent</span><span>DJI</span>
        </div>
        <div>
            <span>Apple</span><span>OKX</span><span>Nike</span><span>Porsche</span><span>Tencent</span><span>DJI</span>
        </div>
    </div>
</section>

<section class="contact" id="contact">
    <div class="section-title" style="margin-bottom: 2rem;">Let's Create</div>
    <a href="mailto:hi@04080606.xyz" class="contact-mail" id="contact-email-link">hi@04080606.xyz</a>
    <div class="socials" id="social-links"></div>
</section>

<script>
// 关闭影院模式
function closeCinema() {
    const modal = document.getElementById('cinema-modal');
    modal.classList.remove('active');
    document.getElementById('cinema-player-box').innerHTML = ''; // 销毁视频器以停止播放
}

// 打开影院模式
window.openCinema = function(url, title, roles) {
    const modal = document.getElementById('cinema-modal');
    document.getElementById('cinema-title').innerText = title || '未命名作品';
    document.getElementById('cinema-roles').innerText = roles || 'Visual Work';
    document.getElementById('cinema-player-box').innerHTML = `<video src="${url}" controls autoplay playsinline></video>`;
    modal.classList.add('active');
};

async function loadData() {
    try {
        const [wRes, sRes] = await Promise.all([fetch('/api/works'), fetch('/api/settings')]);
        const works = await wRes.json();
        const s = await sRes.json();

        // 渲染作品 (Hover播放 + 点击触发影院模式)
        document.getElementById('works-grid').innerHTML = works.map(w => `
            <div class="work-card" onclick="openCinema('${w.videoUrl}', '${w.title}', '${w.roles}')">
                <video src="${w.videoUrl}" muted loop playsinline ${w.posterUrl ? `poster="${w.posterUrl}"` : ''}></video>
                <div class="work-info">
                    <h3 class="work-title">${w.title}</h3>
                    <div class="work-roles">${w.roles || w.tag || 'Project'}</div>
                </div>
            </div>
        `).join('');

        // 绑定Hover事件让视频自动播放
        document.querySelectorAll('.work-card').forEach(card => {
            const vid = card.querySelector('video');
            if(vid) {
                card.addEventListener('mouseenter', () => vid.play());
                card.addEventListener('mouseleave', () => { vid.pause(); vid.currentTime = 0; });
            }
        });

        // 渲染设置
        if(s.heroVideo) document.getElementById('hero-media-container').innerHTML = `<video class="hero-video" autoplay muted loop playsinline src="${s.heroVideo}"></video>`;
        if(s.aboutBody) document.getElementById('about-text').innerHTML = s.aboutBody.replace(/\n/g, '<br>');
        
        const mail = document.getElementById('contact-email-link');
        mail.href = `mailto:${s.contactEmail}`;
        mail.innerText = s.contactEmail || 'hi@04080606.xyz';

        // 渲染社交链接
        const socialData = [
            {label: 'Instagram', url: s.insLink}, {label: '小红书', url: s.xhsLink},
            {label: 'Behance', url: s.behanceLink}, {label: 'Vimeo', url: s.vimeoLink},
            {label: 'YouTube', url: s.ytLink}, {label: 'Bilibili', url: s.biliLink}
        ];
        document.getElementById('social-links').innerHTML = socialData
            .filter(d => d.url).map(d => `<a href="${d.url}" target="_blank">${d.label}</a>`).join('');

    } catch (e) { console.error('Data load failed'); }
}
loadData();
</script>
</body>
</html>
