<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYS.ADMIN — 04080606</title>
<style>
:root {
    --bg-base: #000000;
    --bg-panel: #0E0E0E;
    --bg-input: #151515;
    --text-main: #F5F5F7;
    --text-muted: #86868B;
    --accent: #00D1FF;
    --border: #222222;
    --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg-base); color: var(--text-main); font-family: var(--font-sans); display: flex; min-height: 100vh; }

/* 侧边栏 */
aside { width: 260px; background: var(--bg-panel); border-right: 1px solid var(--border); padding: 2.5rem 1.5rem; display: flex; flex-direction: column; }
.logo { font-size: 1.2rem; font-weight: 700; margin-bottom: 3rem; letter-spacing: 0.1em; color: var(--text-main); }
.logo span { color: var(--accent); }
nav button {
    display: block; width: 100%; background: transparent; border: none; color: var(--text-muted);
    text-align: left; padding: 0.8rem 1rem; margin-bottom: 0.5rem; border-radius: 8px;
    cursor: pointer; font-size: 0.95rem; font-weight: 500; transition: all 0.2s;
}
nav button:hover { background: rgba(255,255,255,0.05); color: var(--text-main); }
nav button.active { background: rgba(0, 209, 255, 0.1); color: var(--accent); }

/* 主内容区 */
main { flex: 1; padding: 4rem; max-width: 900px; }
.section { display: none; animation: fadeIn 0.3s ease; }
.section.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

h1 { font-size: 2rem; font-weight: 600; margin-bottom: 2rem; }
.card { background: var(--bg-panel); padding: 2.5rem; border-radius: 16px; border: 1px solid var(--border); margin-bottom: 2rem; }
.card h3 { margin-bottom: 1.5rem; font-weight: 500; border-bottom: 1px solid var(--border); padding-bottom: 1rem; }

/* 表单质感 */
label { display: block; margin-bottom: 0.5rem; font-size: 0.85rem; color: var(--text-muted); font-weight: 500; }
input, textarea {
    width: 100%; background: var(--bg-input); border: 1px solid var(--border); color: var(--text-main);
    padding: 0.9rem 1rem; border-radius: 8px; margin-bottom: 1.5rem; font-family: inherit; font-size: 0.95rem;
    transition: all 0.2s; outline: none;
}
input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0, 209, 255, 0.15); }
button.primary {
    background: var(--text-main); color: var(--bg-base); border: none; padding: 0.9rem 2rem;
    border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.95rem; transition: all 0.2s;
}
button.primary:hover { background: var(--accent); transform: translateY(-1px); }

/* 作品列表 */
.work-item {
    display: flex; justify-content: space-between; align-items: center; background: var(--bg-input);
    padding: 1.2rem; margin-bottom: 0.8rem; border-radius: 8px; border: 1px solid var(--border);
}
.work-item span { font-weight: 500; }
.btn-danger { color: #FF453A; background: rgba(255, 69, 58, 0.1); border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-weight: 500; }
.btn-danger:hover { background: rgba(255, 69, 58, 0.2); }

/* 登录全屏 */
#login { position: fixed; inset: 0; background: var(--bg-base); display: flex; align-items: center; justify-content: center; z-index: 1000; }
</style>
</head>
<body>
<div id="login">
    <div class="card" style="width: 380px;">
        <div class="logo" style="margin-bottom: 2rem;">SYS<span>.</span>ADMIN</div>
        <label>授权密码</label>
        <input type="password" id="admin-pwd" placeholder="Enter credentials...">
        <button class="primary" onclick="login()" style="width: 100%">Verify Access</button>
    </div>
</div>

<aside>
    <div class="logo">于未<span>氵</span></div>
    <nav>
        <button onclick="showTab('works')" id="btn-works" class="active">Media / 作品</button>
        <button onclick="showTab('settings')" id="btn-settings">System / 网站配置</button>
        <button onclick="logout()" style="margin-top: auto; color: #FF453A;">Logout / 退出</button>
    </nav>
</aside>

<main>
    <div id="tab-works" class="section active">
        <h1>作品阵列</h1>
        <div id="works-list"></div>
        <div class="card" style="margin-top: 2rem;">
            <h3>部署新项目</h3>
            <label>项目代号 (标题)</label><input id="w-title">
            <label>类型标签 (如: 3D Render)</label><input id="w-tag">
            <label>视频流地址 (URL)</label><input id="w-video">
            <button class="primary" onclick="addWork()">Deploy / 部署</button>
        </div>
    </div>

    <div id="tab-settings" class="section">
        <h1>系统配置</h1>
        <div class="card">
            <h3>前端显示参数</h3>
            <label>首屏动态壁纸 (Video URL)</label><input id="s-video">
            <label>首屏宣言 (Sub-text)</label><textarea id="s-sub" rows="3"></textarea>
            <label>联络终端 (Email)</label><input id="s-email">
            
            <h3 style="margin-top: 3rem;">外部链接节点 (Socials)</h3>
            <label>Instagram</label><input id="s-ins">
            <label>小红书</label><input id="s-xhs">
            <label>X (Twitter)</label><input id="s-x">
            <label>Telegram</label><input id="s-tg">
            <label>Bilibili</label><input id="s-bili">
            <label>Behance</label><input id="s-behance">
            <label>Weibo</label><input id="s-weibo">
            
            <button class="primary" onclick="saveSettings()" style="margin-top: 1rem;">Update System / 同步配置</button>
        </div>
    </div>
</main>

<script>
let token = sessionStorage.getItem('admin_token');
if(token) document.getElementById('login').style.display = 'none';

async function login() {
    const pwd = document.getElementById('admin-pwd').value;
    const res = await fetch('/api/login', {method:'POST', body: JSON.stringify({password: pwd})});
    if(res.ok) {
        sessionStorage.setItem('admin_token', (await res.json()).token);
        location.reload();
    } else { alert('Access Denied'); }
}

function showTab(name) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-'+name).classList.add('active');
    document.getElementById('btn-'+name).classList.add('active');
}

async function api(path, method='GET', body=null) {
    const res = await fetch('/api'+path, {
        method, headers: {'Authorization': 'Bearer ' + sessionStorage.getItem('admin_token'), 'Content-Type': 'application/json'},
        body: body ? JSON.stringify(body) : null
    });
    if(res.status === 401) logout();
    return res.json();
}

async function loadData() {
    const works = await api('/admin/works');
    document.getElementById('works-list').innerHTML = works.map((w, i) => `
        <div class="work-item">
            <span>${w.title} <span style="color:var(--text-muted); font-size:0.8rem; margin-left:1rem">${w.tag || ''}</span></span>
            <button class="btn-danger" onclick="deleteWork(${i})">Delete</button>
        </div>
    `).join('');

    const s = await api('/admin/settings');
    document.getElementById('s-video').value = s.heroVideo || '';
    document.getElementById('s-sub').value = s.heroSub || '';
    document.getElementById('s-email').value = s.contactEmail || '';
    ['ins','xhs','x','tg','bili','behance','weibo'].forEach(key => {
        document.getElementById(`s-${key}`).value = s[`${key}Link`] || '';
    });
}

async function addWork() {
    const works = await api('/admin/works');
    works.push({ title: document.getElementById('w-title').value, tag: document.getElementById('w-tag').value, videoUrl: document.getElementById('w-video').value });
    await api('/admin/works', 'PUT', works);
    location.reload();
}

async function deleteWork(i) {
    const works = await api('/admin/works');
    works.splice(i, 1);
    await api('/admin/works', 'PUT', works);
    location.reload();
}

async function saveSettings() {
    const s = {
        heroVideo: document.getElementById('s-video').value, heroSub: document.getElementById('s-sub').value, contactEmail: document.getElementById('s-email').value,
        insLink: document.getElementById('s-ins').value, xhsLink: document.getElementById('s-xhs').value, xLink: document.getElementById('s-x').value,
        tgLink: document.getElementById('s-tg').value, biliLink: document.getElementById('s-bili').value, behanceLink: document.getElementById('s-behance').value, weiboLink: document.getElementById('s-weibo').value
    };
    await api('/admin/settings', 'PUT', s);
    alert('System Updated Successfully.');
}

function logout() { sessionStorage.removeItem('admin_token'); location.reload(); }
if(token) loadData();
</script>
</body>
</html>
