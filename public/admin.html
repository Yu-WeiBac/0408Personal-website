<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 — 于未氵</title>
<style>
:root {
    --ink: #0A0A0A; --ink-2: #1A1A1A; --paper: #F2F0E6; --jade: #6FE3D2;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
}
body { background: var(--ink); color: var(--paper); font-family: var(--font); margin: 0; display: flex; min-height: 100vh; }
aside { width: 200px; background: var(--ink-2); padding: 2rem; border-right: 1px solid #333; }
nav button { display: block; width: 100%; background: none; border: none; color: #888; text-align: left; padding: 0.8rem; cursor: pointer; font-size: 1rem; }
nav button.active { color: var(--jade); }
main { flex: 1; padding: 3rem; max-width: 800px; }
.section { display: none; }
.section.active { display: block; }
.card { background: var(--ink-2); padding: 2rem; border-radius: 8px; margin-bottom: 2rem; }
label { display: block; margin-bottom: 0.5rem; font-size: 0.8rem; color: #888; }
input, textarea { width: 100%; background: #000; border: 1px solid #333; color: #fff; padding: 0.8rem; border-radius: 4px; margin-bottom: 1.5rem; font-family: inherit; }
button.primary { background: var(--jade); color: #000; border: none; padding: 0.8rem 2rem; border-radius: 4px; cursor: pointer; font-weight: bold; }
.work-item { display: flex; justify-content: space-between; background: #000; padding: 1rem; margin-bottom: 0.5rem; border-radius: 4px; }
/* 登录 */
#login { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; z-index: 1000; }
</style>
</head>
<body>
<div id="login">
    <div class="card" style="width: 300px;">
        <h2 style="color: var(--jade)">管理登录</h2>
        <input type="password" id="admin-pwd" placeholder="输入管理密码">
        <button class="primary" onclick="login()" style="width: 100%">进入控制台</button>
    </div>
</div>

<aside>
    <h2 style="color: var(--jade)">于未氵</h2><br>
    <nav>
        <button onclick="showTab('works')" id="btn-works" class="active">作品管理</button>
        <button onclick="showTab('settings')" id="btn-settings">网站设置</button>
        <button onclick="logout()">退出登录</button>
    </nav>
</aside>

<main>
    <div id="tab-works" class="section active">
        <h1>作品管理</h1>
        <div id="works-list"></div>
        <div class="card">
            <h3>添加作品</h3>
            <label>标题</label><input id="w-title">
            <label>标签</label><input id="w-tag">
            <label>视频链接 (R2)</label><input id="w-video">
            <button class="primary" onclick="addWork()">保存作品</button>
        </div>
    </div>

    <div id="tab-settings" class="section">
        <h1>网站设置</h1>
        <div class="card">
            <label>首页视频链接</label><input id="s-video">
            <label>首屏副标题</label><textarea id="s-sub"></textarea>
            <label>联系邮箱</label><input id="s-email">
            
            <h3 style="color: var(--jade); margin: 2rem 0 1rem;">社交媒体链接</h3>
            <label>Instagram</label><input id="s-ins">
            <label>小红书</label><input id="s-xhs">
            <label>X (Twitter)</label><input id="s-x">
            <label>Telegram 群组</label><input id="s-tg">
            <label>B站 (Bilibili)</label><input id="s-bili">
            <label>Behance</label><input id="s-behance">
            <label>微博</label><input id="s-weibo">
            
            <button class="primary" onclick="saveSettings()">保存所有设置</button>
        </div>
    </div>
</main>

<script>
let token = sessionStorage.getItem('admin_token');
if(token) document.getElementById('login').style.display = 'none';

async function login() {
    const pwd = document.getElementById('admin-pwd').value;
    const res = await fetch('/api/login', {method:'POST', body: JSON.stringify({password: pwd})});
    if(res.ok) {
        const data = await res.json();
        sessionStorage.setItem('admin_token', data.token);
        location.reload();
    } else { alert('密码错误'); }
}

function showTab(name) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-'+name).classList.add('active');
    document.getElementById('btn-'+name).classList.add('active');
}

async function api(path, method='GET', body=null) {
    const res = await fetch('/api'+path, {
        method,
        headers: {'Authorization': 'Bearer ' + sessionStorage.getItem('admin_token'), 'Content-Type': 'application/json'},
        body: body ? JSON.stringify(body) : null
    });
    if(res.status === 401) logout();
    return res.json();
}

async function loadData() {
    const works = await api('/admin/works');
    document.getElementById('works-list').innerHTML = works.map((w, i) => `
        <div class="work-item">
            <span>${w.title}</span>
            <button onclick="deleteWork(${i})" style="color: red; background: none; border: none; cursor: pointer;">删除</button>
        </div>
    `).join('');

    const s = await api('/admin/settings');
    document.getElementById('s-video').value = s.heroVideo || '';
    document.getElementById('s-sub').value = s.heroSub || '';
    document.getElementById('s-email').value = s.contactEmail || '';
    document.getElementById('s-ins').value = s.insLink || '';
    document.getElementById('s-xhs').value = s.xhsLink || '';
    document.getElementById('s-x').value = s.xLink || '';
    document.getElementById('s-tg').value = s.tgLink || '';
    document.getElementById('s-bili').value = s.biliLink || '';
    document.getElementById('s-behance').value = s.behanceLink || '';
    document.getElementById('s-weibo').value = s.weiboLink || '';
}

async function addWork() {
    const works = await api('/admin/works');
    works.push({
        title: document.getElementById('w-title').value,
        tag: document.getElementById('w-tag').value,
        videoUrl: document.getElementById('w-video').value
    });
    await api('/admin/works', 'PUT', works);
    location.reload();
}

async function deleteWork(i) {
    const works = await api('/admin/works');
    works.splice(i, 1);
    await api('/admin/works', 'PUT', works);
    location.reload();
}

async function saveSettings() {
    const s = {
        heroVideo: document.getElementById('s-video').value,
        heroSub: document.getElementById('s-sub').value,
        contactEmail: document.getElementById('s-email').value,
        insLink: document.getElementById('s-ins').value,
        xhsLink: document.getElementById('s-xhs').value,
        xLink: document.getElementById('s-x').value,
        tgLink: document.getElementById('s-tg').value,
        biliLink: document.getElementById('s-bili').value,
        behanceLink: document.getElementById('s-behance').value,
        weiboLink: document.getElementById('s-weibo').value
    };
    await api('/admin/settings', 'PUT', s);
    alert('设置已保存并同步到前台！');
}

function logout() { sessionStorage.removeItem('admin_token'); location.reload(); }
if(token) loadData();
</script>
</body>
</html>
