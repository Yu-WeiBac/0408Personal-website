<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYS.ADMIN — 于未氵</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
    --bg-base: #000000;
    --glass: rgba(255, 255, 255, 0.04);
    --glass-border: rgba(255, 255, 255, 0.08);
    --cyan: #00D1FF;
    --text: #FFFFFF;
    --text-dim: rgba(255, 255, 255, 0.5);
    --mx: 50%; --my: 50%;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg-base); color: var(--text); font-family: 'Inter', sans-serif; display: flex; min-height: 100vh; overflow-x: hidden; }

/* 响应鼠标的背景光 */
.ambient { position: fixed; inset: 0; z-index: -1; background: #000; overflow: hidden; }
.orb { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.2; transition: transform 0.8s ease-out; }
.orb-1 { width: 50vw; height: 50vw; background: #0044FF; left: calc(var(--mx) - 25vw); top: calc(var(--my) - 25vw); }
.orb-2 { width: 40vw; height: 40vw; background: var(--cyan); right: calc(var(--mx) - 20vw); bottom: calc(var(--my) - 20vw); }

/* 玻璃侧边栏 */
aside {
    width: 260px; background: rgba(10, 10, 12, 0.4); backdrop-filter: blur(30px);
    border-right: 1px solid var(--glass-border); padding: 3rem 1.5rem; display: flex; flex-direction: column; position: fixed; height: 100vh;
}
.logo { font-size: 1.1rem; font-weight: 600; margin-bottom: 3rem; color: #fff; letter-spacing: 1px; }
.logo span { color: var(--cyan); }
nav button {
    display: block; width: 100%; background: transparent; border: none; color: var(--text-dim);
    text-align: left; padding: 1rem 1.2rem; margin-bottom: 0.5rem; border-radius: 12px;
    cursor: pointer; font-size: 0.9rem; transition: 0.3s;
}
nav button.active { background: rgba(255,255,255,0.06); color: var(--cyan); }

/* 主面板 */
main { margin-left: 260px; flex: 1; padding: 4rem; max-width: 1000px; }
.section { display: none; animation: fadeIn 0.4s ease; }
.section.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* 极致玻璃卡片 */
.glass-card {
    background: var(--glass); backdrop-filter: blur(40px);
    padding: 2.5rem; border-radius: 24px; border: 1px solid var(--glass-border); margin-bottom: 2rem;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
}

label { display: block; margin-bottom: 0.6rem; font-size: 0.8rem; color: var(--text-dim); text-transform: uppercase; }
input, textarea, select {
    width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); color: #fff;
    padding: 1rem; border-radius: 12px; margin-bottom: 1.5rem; outline: none; transition: 0.3s;
}
input:focus { border-color: var(--cyan); box-shadow: 0 0 0 4px rgba(0,209,255,0.1); }

button.primary {
    background: #fff; color: #000; border: none; padding: 1rem 2.5rem;
    border-radius: 12px; cursor: pointer; font-weight: 600; transition: 0.3s;
}
button.primary:hover { background: var(--cyan); transform: translateY(-2px); box-shadow: 0 5px 15px var(--cyan-glow); }

.item {
    display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.02);
    padding: 1.2rem; margin-bottom: 0.8rem; border-radius: 12px; border: 1px solid var(--glass-border);
}
.btn-danger { color: #ff453a; background: none; border: 1px solid #ff453a; padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; transition: 0.3s; }
.btn-danger:hover { background: #ff453a; color: #fff; }

#login { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; z-index: 1000; }
</style>
</head>
<body>
<div class="ambient"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>

<div id="login"><div class="glass-card" style="width: 380px; text-align: center;"><h2 style="margin-bottom:2rem">SYS<span>.</span>ADMIN</h2><input type="password" id="admin-pwd" style="text-align: center;"><button class="primary" onclick="login()" style="width:100%">VERIFY</button></div></div>

<aside>
    <div class="logo">于未<span>氵</span> ADMIN</div>
    <nav>
        <button onclick="showTab('works')" id="btn-works" class="active">成片展示 (Works)</button>
        <button onclick="showTab('settings')" id="btn-settings">全站设置 (System)</button>
        <button onclick="logout()" style="margin-top: auto; color: #ff453a;">Logout</button>
    </nav>
</aside>

<main>
    <div id="tab-works" class="section active">
        <h1>成片阵列</h1>
        <div id="works-list"></div>
        <div class="glass-card" style="margin-top: 3rem;">
            <h3 style="margin-bottom: 1.5rem; color: var(--cyan);">+ 部署新影像</h3>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 0 1rem;">
                <div><label>项目标题</label><input id="w-title"></div>
                <div><label>分类 (如: 3D / 剪辑)</label><input id="w-tag"></div>
            </div>
            <label>视频 URL (R2)</label><input id="w-video">
            <button class="primary" onclick="addWork()">部署 (Deploy)</button>
        </div>
    </div>

    <div id="tab-settings" class="section">
        <h1>系统参数</h1>
        <div class="glass-card">
            <label>首页视频 URL</label><input id="s-video">
            <label>联系邮箱</label><input id="s-email">
            <h3 style="margin: 2.5rem 0 1.5rem; border-top: 1px solid #222; padding-top: 2rem;">社交网络 (Socials)</h3>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 0 1rem;">
                <div><label>Instagram</label><input id="s-ins"></div>
                <div><label>哔哩哔哩 (B站)</label><input id="s-bili"></div>
                <div><label>X (Twitter)</label><input id="s-x"></div>
                <div><label>小红书</label><input id="s-xhs"></div>
                <div><label>YouTube (油管)</label><input id="s-yt"></div>
                <div><label>Behance</label><input id="s-behance"></div>
                <div><label>Vimeo (维密欧)</label><input id="s-vimeo"></div>
                <div><label>微博</label><input id="s-weibo"></div>
            </div>
            <button class="primary" id="save-btn" onclick="saveSettings()" style="width: 100%; margin-top: 2rem;">更新全站配置</button>
        </div>
    </div>
</main>

<script>
// 鼠标光影驱动
document.addEventListener('mousemove', e => {
    document.documentElement.style.setProperty('--mx', (e.clientX/window.innerWidth*100)+'%');
    document.documentElement.style.setProperty('--my', (e.clientY/window.innerHeight*100)+'%');
});

let token = sessionStorage.getItem('admin_token');
if(token) document.getElementById('login').style.display = 'none';

async function login() {
    const r = await fetch('/api/login',{method:'POST', body:JSON.stringify({password:document.getElementById('admin-pwd').value})});
    if(r.ok){sessionStorage.setItem('admin_token',(await r.json()).token); location.reload();} else alert('Denied');
}

function showTab(n){
    document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
    document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
    document.getElementById('tab-'+n).classList.add('active');
    document.getElementById('btn-'+n).classList.add('active');
}

async function api(p,m='GET',b=null){const r=await fetch('/api'+p,{method:m,headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:b?JSON.stringify(b):null});return r.json()}

async function loadData() {
    const works = await api('/admin/works');
    document.getElementById('works-list').innerHTML = works.map((w,i)=>`<div class="item"><span>${w.title}</span><button class="btn-danger" onclick="deleteWork(${i})">Remove</button></div>`).join('');
    const s = await api('/admin/settings');
    document.getElementById('s-video').value = s.heroVideo || '';
    document.getElementById('s-email').value = s.contactEmail || '';
    ['ins','bili','x','xhs','yt','behance','vimeo','weibo'].forEach(k=>{document.getElementById(`s-${k}`).value=s[`${k}Link`]||''});
}

async function addWork(){
    const works=await api('/admin/works');
    works.push({title:document.getElementById('w-title').value, videoUrl:document.getElementById('w-video').value, tag:document.getElementById('w-tag').value});
    await api('/admin/works','PUT',works); location.reload();
}

async function saveSettings(){
    const b=document.getElementById('save-btn'); b.innerText='Syncing...';
    const s = {
        heroVideo: document.getElementById('s-video').value, contactEmail: document.getElementById('s-email').value,
        insLink: document.getElementById('s-ins').value, biliLink: document.getElementById('s-bili').value, xLink: document.getElementById('s-x').value,
        xhsLink: document.getElementById('s-xhs').value, ytLink: document.getElementById('s-yt').value, behanceLink: document.getElementById('s-behance').value,
        vimeoLink: document.getElementById('s-vimeo').value, weiboLink: document.getElementById('s-weibo').value
    };
    await api('/admin/settings','PUT',s); b.innerText='✅ SUCCESS'; setTimeout(()=>b.innerText='Update System',2000);
}
if(token) loadData();
function logout(){sessionStorage.removeItem('admin_token'); location.reload();}
</script>
</body>
</html>
