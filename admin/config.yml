# ---------------------------------------------------------
# 这是你的后台基础设置
# ---------------------------------------------------------
backend:
  # 我们告诉后台，使用 GitHub 作为保存和读取内容的地方
  name: github
  # 这是你的 GitHub 仓库地址，也就是你存放代码的“仓库名”
  repo: Yu-WeiBac/0408Personal-website
  # 这是你的代码主分支名称，也就是你当前所在的默认分支
  branch: main
  base_url: https://04080606.xyz  # 新增这一行！(结尾不要加斜杠)

# ---------------------------------------------------------
# 媒体文件（图片、视频、GIF）的设置
# ---------------------------------------------------------
# 当你在后台点击“上传”图片或视频时，它们会被保存在你代码仓库的这个文件夹里
media_folder: "uploads"
# 当你的前端黑白网页需要显示这些媒体时，它会去这个路径下读取
public_folder: "/uploads"

# ---------------------------------------------------------
# 内容集合（定义你在后台能修改什么）
# ---------------------------------------------------------
collections:
    # 这个集合在系统内部的英文代号
  - name: "portfolio"
    # 这个集合在后台可视化界面上显示的中文名字
    label: "作品展示"
    # 你在后台填写的文字等内容，最终会生成文件保存在这个 _data 文件夹中
    folder: "_data"
    # 允许你在后台点击“新建”按钮来创建新的内容条目
    create: true
    # 后台自动保存文件时的命名规则（这里我们用默认的 content）
    slug: "content"
    # 我们将内容保存为 JSON 格式（一种数据格式），方便前端网页读取
    extension: "json"
    
    # fields 定义了你在后台填表时，会看到哪些具体的输入框
    fields:
        # 第一个输入框：用来填写主标题（widget: "string" 表示单行文本框）
      - {label: "主标题", name: "title", widget: "string"}
        # 第二个输入框：用来填写副标题
      - {label: "副标题", name: "subtitle", widget: "string"}
        # 第三个输入框：用来上传视频或 GIF（widget: "file" 表示文件上传器，required: false 表示不强制必须上传）
      - {label: "展示视频或GIF", name: "media", widget: "file", required: false}
