<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYS.ADMIN — 于未氵</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
    --bg-base: #000000;
    --glass-bg: rgba(20, 20, 22, 0.5);
    --glass-border: rgba(255, 255, 255, 0.08);
    --input-bg: rgba(0, 0, 0, 0.6);
    --cyan: #00D1FF;
    --text-main: #FFFFFF;
    --text-sec: rgba(255, 255, 255, 0.5);
    --font-main: 'Inter', 'Noto Sans SC', -apple-system, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg-base); color: var(--text-main); font-family: var(--font-main); display: flex; min-height: 100vh; overflow-x: hidden; }

/* 背景底光 */
.ambient { position: fixed; inset: 0; z-index: -1; background: radial-gradient(circle at 100% 0%, rgba(0, 209, 255, 0.15) 0%, transparent 50%), radial-gradient(circle at 0% 100%, rgba(0, 85, 255, 0.1) 0%, transparent 50%); }

/* 侧边栏玻璃态 */
aside {
    width: 260px; background: rgba(10, 10, 12, 0.4); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border-right: 1px solid var(--glass-border); padding: 3rem 1.5rem; display: flex; flex-direction: column;
}
.logo { font-size: 1.2rem; font-weight: 500; margin-bottom: 3rem; letter-spacing: 2px; color: var(--text-main); }
.logo span { color: var(--cyan); }
nav button {
    display: block; width: 100%; background: transparent; border: none; color: var(--text-sec);
    text-align: left; padding: 1rem 1.2rem; margin-bottom: 0.5rem; border-radius: 12px;
    cursor: pointer; font-size: 0.9rem; font-weight: 400; letter-spacing: 1px; transition: all 0.3s ease;
}
nav button:hover { background: rgba(255,255,255,0.03); color: var(--text-main); }
nav button.active { background: rgba(0, 209, 255, 0.1); color: var(--cyan); border: 1px solid rgba(0, 209, 255, 0.2); }

main { flex: 1; padding: 4rem; max-width: 900px; }
.section { display: none; animation: fadeIn 0.4s ease; }
.section.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

h1 { font-size: 2rem; font-weight: 300; margin-bottom: 2rem; letter-spacing: 2px; }

/* 玻璃质感控制面板 */
.glass-card {
    background: var(--glass-bg); backdrop-filter: blur(32px); -webkit-backdrop-filter: blur(32px);
    padding: 3rem; border-radius: 24px; border: 1px solid var(--glass-border); margin-bottom: 2rem;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
}
.glass-card h3 { margin-bottom: 1.5rem; font-weight: 400; color: var(--cyan); letter-spacing: 1px; font-size: 1.1rem; }

/* 输入框拟物化 */
label { display: block; margin-bottom: 0.6rem; font-size: 0.8rem; color: var(--text-sec); letter-spacing: 1px; }
input, textarea {
    width: 100%; background: var(--input-bg); border: 1px solid rgba(255,255,255,0.1); color: var(--text-main);
    padding: 1rem 1.2rem; border-radius: 12px; margin-bottom: 1.5rem; font-family: inherit; font-size: 0.95rem;
    transition: all 0.3s ease; outline: none; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
}
input:focus, textarea:focus { border-color: var(--cyan); box-shadow: inset 0 2px 4px rgba(0,0,0,0.5), 0 0 0 3px rgba(0, 209, 255, 0.15); }
button.primary {
    background: var(--text-main); color: #000; border: none; padding: 1rem 2.5rem;
    border-radius: 12px; cursor: pointer; font-weight: 500; font-size: 0.95rem; letter-spacing: 1px; transition: all 0.3s ease;
}
button.primary:hover { background: var(--cyan); box-shadow: 0 0 20px rgba(0, 209, 255, 0.4); transform: translateY(-2px); }

.work-item {
    display: flex; justify-content: space-between; align-items: center; background: var(--input-bg);
    padding: 1.2rem 1.5rem; margin-bottom: 1rem; border-radius: 12px; border: 1px solid var(--glass-border);
}
.btn-danger { color: #FF453A; background: rgba(255, 69, 58, 0.1); border: 1px solid rgba(255, 69, 58, 0.2); padding: 0.6rem 1.2rem; border-radius: 8px; cursor: pointer; font-size: 0.8rem; transition: 0.3s; }
.btn-danger:hover { background: #FF453A; color: #fff; }

#login { position: fixed; inset: 0; background: var(--bg-base); display: flex; align-items: center; justify-content: center; z-index: 1000; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1.5rem; }
</style>
</head>
<body>
<div class="ambient"></div>

<div id="login">
    <div class="glass-card" style="width: 400px; padding: 4rem 3rem;">
        <div class="logo" style="text-align: center; margin-bottom: 2.5rem; font-size: 1.5rem;">SYS<span>.</span>ADMIN</div>
        <label style="text-align: center;">授权密钥</label>
        <input type="password" id="admin-pwd" style="text-align: center; letter-spacing: 3px;">
        <button class="primary" onclick="login()" style="width: 100%; margin-top: 1rem;">VERIFY ACCESS</button>
    </div>
</div>

<aside>
    <div class="logo">于未<span>氵</span></div>
    <nav>
        <button onclick="showTab('works')" id="btn-works" class="active">Media / 作品</button>
        <button onclick="showTab('settings')" id="btn-settings">System / 网站配置</button>
        <button onclick="logout()" style="margin-top: auto; color: var(--text-sec);">Logout / 退出</button>
    </nav>
</aside>

<main>
    <div id="tab-works" class="section active">
        <h1>作品阵列</h1>
        <div id="works-list"></div>
        <div class="glass-card" style="margin-top: 3rem;">
            <h3>部署新影像</h3>
            <div class="grid-2">
                <div><label>项目代号 (标题)</label><input id="w-title"></div>
                <div><label>类型标签 (如: 3D Render)</label><input id="w-tag"></div>
            </div>
            <label>视频流地址 (URL)</label><input id="w-video">
            <button class="primary" onclick="addWork()">Deploy / 部署</button>
        </div>
    </div>

    <div id="tab-settings" class="section">
        <h1>系统配置</h1>
        <div class="glass-card">
            <h3>核心显示参数</h3>
            <label>首屏动态壁纸 (Video URL)</label><input id="s-video">
            <label>首屏宣言 (支持多行)</label><textarea id="s-sub" rows="4"></textarea>
            <label>联络邮箱 (Email)</label><input id="s-email">
            
            <h3 style="margin-top: 4rem;">外部神经节点 (Socials)</h3>
            <div class="grid-2">
                <div><label>Instagram</label><input id="s-ins"></div>
                <div><label>小红书</label><input id="s-xhs"></div>
                <div><label>X (Twitter)</label><input id="s-x"></div>
                <div><label>Telegram</label><input id="s-tg"></div>
                <div><label>Bilibili (B站)</label><input id="s-bili"></div>
                <div><label>Behance</label><input id="s-behance"></div>
                <div><label>Weibo (微博)</label><input id="s-weibo"></div>
            </div>
            <button class="primary" onclick="saveSettings()" style="margin-top: 2rem;">Update System / 同步配置</button>
        </div>
    </div>
</main>

<script>
let token = sessionStorage.getItem('admin_token');
if(token) document.getElementById('login').style.display = 'none';

async function login() {
    const pwd = document.getElementById('admin-pwd').value;
    const res = await fetch('/api/login', {method:'POST', body: JSON.stringify({password: pwd})});
    if(res.ok) { sessionStorage.setItem('admin_token', (await res.json()).token); location.reload(); } 
    else { alert('Access Denied'); }
}

function showTab(name) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-'+name).classList.add('active');
    document.getElementById('btn-'+name).classList.add('active');
}

async function api(path, method='GET', body=null) {
    const res = await fetch('/api'+path, {
        method, headers: {'Authorization': 'Bearer ' + sessionStorage.getItem('admin_token'), 'Content-Type': 'application/json'},
        body: body ? JSON.stringify(body) : null
    });
    if(res.status === 401) logout();
    return res.json();
}

async function loadData() {
    const works = await api('/admin/works');
    document.getElementById('works-list').innerHTML = works.map((w, i) => `
        <div class="work-item">
            <span>${w.title} <span style="color:var(--text-sec); font-size:0.8rem; margin-left:1rem">${w.tag || ''}</span></span>
            <button class="btn-danger" onclick="deleteWork(${i})">Delete</button>
        </div>
    `).join('');

    const s = await api('/admin/settings');
    document.getElementById('s-video').value = s.heroVideo || '';
    document.getElementById('s-sub').value = s.heroSub || '';
    document.getElementById('s-email').value = s.contactEmail || '';
    ['ins','xhs','x','tg','bili','behance','weibo'].forEach(key => { document.getElementById(`s-${key}`).value = s[`${key}Link`] || ''; });
}

async function addWork() {
    const works = await api('/admin/works');
    works.push({ title: document.getElementById('w-title').value, tag: document.getElementById('w-tag').value, videoUrl: document.getElementById('w-video').value });
    await api('/admin/works', 'PUT', works);
    location.reload();
}

async function deleteWork(i) {
    const works = await api('/admin/works');
    works.splice(i, 1);
    await api('/admin/works', 'PUT', works);
    location.reload();
}

async function saveSettings() {
    const s = {
        heroVideo: document.getElementById('s-video').value, heroSub: document.getElementById('s-sub').value, contactEmail: document.getElementById('s-email').value,
        insLink: document.getElementById('s-ins').value, xhsLink: document.getElementById('s-xhs').value, xLink: document.getElementById('s-x').value,
        tgLink: document.getElementById('s-tg').value, biliLink: document.getElementById('s-bili').value, behanceLink: document.getElementById('s-behance').value, weiboLink: document.getElementById('s-weibo').value
    };
    await api('/admin/settings', 'PUT', s);
    alert('System Updated Successfully.');
}

function logout() { sessionStorage.removeItem('admin_token'); location.reload(); }
if(token) loadData();
</script>
</body>
</html>
